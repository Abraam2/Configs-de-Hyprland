# ==========================================
# TERMINAL, COLORES Y CURSOR PLANO
# ==========================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -sg escape-time 10
set -s extended-keys on

# Barra de estado arriba
set -g status-position top

# ==========================================
# LEADER Y CONFIGURACIÓN BASE (DEL BLOG)
# ==========================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# MODO COPIA ESTILO VIM (CALCADO DEL BLOG)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

# ==========================================
# DIVISIONES (PANELS) CON V Y H
# ==========================================
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# ==========================================
# CONTROL DE PESTAÑAS DIRECTO (SIN LEADER)
# ==========================================
# Crear pestaña nueva con Ctrl + t
bind -n C-t new-window -c "#{pane_current_path}"

# Cerrar pestaña actual con Ctrl + q (pide confirmación rápida)
bind -n C-q confirm-before -p "¿Cerrar este tab? y/n" kill-window
# Cerrar tab sin confirmación
# bind -n C-q kill-window

# No va nada xd
bind C-j display-popup -E "~/.mydotfiles/com.ml4w.dotfiles/.config/tmux/sesionfzf.sh"

# Saltar entre pestañas con Alt + Número (como en Kitty)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind r source-file ~/.tmux.conf \; display "¡Config recargada, fiera!"

# ==========================================
# TERMINAL FLOTANTE (ALT + G)
# ==========================================
bind-key -n M-k if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -E -k "tmux new-session -A -s scratch"
}

# ==========================================
# PLUGINS BASE (TPM)
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @tmux-which-key-config '/home/abraham/.mydotfiles/com.ml4w.dotfiles/.config/tmux/tmux.conf'
# set -g @plugin 'Nucc/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cowboy'
# set -g @plugin 'sainnhe/tmux-fzf'
# TMUX_FZF_LAUNCH_KEY="space"

# ==========================================
# TEMA CATPPUCCIN (PAGINACIÓN LIMPIA A LA IZQUIERDA)
# ==========================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

run ~/.mydotfiles/com.ml4w.dotfiles/.config/tmux/plugins/catppuccin/catppuccin.tmux

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "" 
set -g status-right "#{E:@catppuccin_status_directory}"

# Inicializador de TPM (Apunta al enlace simbólico original)
run '~/.tmux/plugins/tpm/tpm'
