[mgr]
ratio = [1, 2, 2]
# scrolloff = 3
# show_hidden = true

# [preview]
# wrap            = "no"
# tab_size        = 2
# max_width       = 600
# max_height      = 900

[opener]
extract = [{ run = 'ouch d -y %s', desc = "Extract here", for = "unix" }]

mi_nvim = [{ run = '~/scripts-global/nv %s', orphan = true, desc = "Neovim" }]

gimp = [{ run = 'gimp %s', orphan = true, desc = "GIMP" }]

visor_imagenes = [{ run = 'xdg-open %s1', orphan = true, desc = "Ver imagen" }]

appimage = [{ run = '%s1', orphan = true, desc = "Ejecutar AppImage" }]

[open]
prepend_rules = [
    { url = "*.appimage", use = ["appimage", "reveal"] },

    { url = "*.txt", use = ["mi_nvim", "reveal"] },
    { url = "*.lua", use = ["mi_nvim", "reveal"] },
    { url = "*.sh", use = ["mi_nvim", "reveal"] },
    { url = "*.md", use = ["mi_nvim", "reveal"] },
    { url = "*.json", use = ["mi_nvim", "reveal"] },
    { url = "*.conf", use = ["mi_nvim", "reveal"] },
    { mime = "text/*", use = ["mi_nvim", "reveal"] },
    { mime = "inode/empty", use = ["mi_nvim", "reveal"] },

    # Usamos el nuevo visor "orphan" y añadimos "reveal" a la lista
    { mime = "image/*", use = ["visor_imagenes", "gimp", "reveal"] },
]

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run = "ouch"

