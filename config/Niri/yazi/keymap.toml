# ==============================================================================
# 1. NAVEGACIÓN Y DIRECTORIOS (Go To)
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "Go ~"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Descargas/"
desc = "Go ~/Descargas/"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documentos"
desc = "Go ~/Documentos/"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/.mydots/config/Niri/niri"
desc = "Go niri config"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = "cd ~/.mydots/config/Niri"
desc = "Go dots config"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd ~/.mydots/config/Niri"
desc = "Go dots config"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"


# ==============================================================================
# 2. GESTIÓN DE PESTAÑAS (Tabs)
# ==============================================================================

[[mgr.prepend_keymap]]
on = "H"
run = "tab_switch -1 --relative"
desc = "Cambiar a la pestaña anterior"

[[mgr.prepend_keymap]]
on = "L"
run = "tab_switch 1 --relative"
desc = "Cambiar a la siguiente pestaña"

[[mgr.prepend_keymap]]
on = ["t", "c"]
run = "close"
desc = "Close active tab"

[[mgr.prepend_keymap]]
on = ["T"]
run = "plugin close-and-restore-tab restore"
desc = "Restore the previously closed tab"

[[mgr.prepend_keymap]]
on = ["t", "R"]
run = "plugin close-and-restore-tab restore"
desc = "Restore the previously closed tab"


# ==============================================================================
# 3. COMPRESIÓN Y DESCOMPRESIÓN (Ouch & Compress Plugin)
# ==============================================================================

# --- Descompresión (Ouch) ---
[[mgr.prepend_keymap]]
on = ["<C-z>", "u"]
run = 'shell -- ouch decompress "$@" --dir .'
desc = "Descomprimir archivos seleccionados"

[[mgr.prepend_keymap]]
on = ["<C-z>", "x"]
run = '''shell 'ouch decompress "$1" --dir . && dir=$(find . -maxdepth 1 -type d -not -path . -printf "%T@ %p\n" | sort -n | tail -1 | cut -d" " -f2-) && [ -n "$dir" ] && mv -f "$dir"/* . 2>/dev/null; rm -rf "$dir"' --confirm'''
desc = "Descomprimir y extraer contenido a la raíz"

# --- Compresión avanzada (Plugin Compress) ---
[[mgr.prepend_keymap]]
on = ["<C-z>", "c"]
run = "plugin compress"
desc = ".zip con nombre"

# --- Compresión rápida (Ouch) ---
[[mgr.prepend_keymap]]
on = ["<C-z>", "z"]
run = 'shell -- ouch compress "$@" %h.zip'
desc = "Comprimir en .zip"

[[mgr.prepend_keymap]]
on = ["<C-z>", "t"]
run = 'shell -- ouch compress "$@" %h.tar.gz'
desc = "Comprimir en .tar.gz"

[[mgr.prepend_keymap]]
on = ["<C-z>", "7"]
run = 'shell -- ouch compress --fast "$@" %h.7z'
desc = "Comprimir en .7z (Modo rápido)"

[[mgr.prepend_keymap]]
on = ["<C-z>", "p"]
run = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["<C-z>", "h"]
run = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on = ["<C-z>", "l"]
run = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on = ["<C-z>", "A"]
run = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"


# ==============================================================================
# 4. OPERACIONES CON ARCHIVOS (Copiar, Pegar, Mover, Utilidades)
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["y"]
run = "plugin ucp copy"
desc = "Copy ucp"

[[mgr.prepend_keymap]]
on = ["<C-p>"]
run = "paste"
desc = "Pegar nativo"

[[mgr.prepend_keymap]]
on = ["p"]
run = "plugin padrastro-borracho"
desc = "Pegar con gestión de colisiones (experimental)"

[[mgr.prepend_keymap]]
on = ["M"]
run = "plugin mover"
desc = "Mover archivos de extensión X desde subcarpetas aquí"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin magia"
desc = "Convertir imágenes con magia"

[[mgr.prepend_keymap]]
on = ["t", "k"]
run = "shell 'kitty \"$(pwd)\"' --orphan"
desc = "Abrir kitty en la ruta actual"


# ==============================================================================
# 5. PERMISOS Y PROPIEDADES (Chmod)
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["e", "a"]
run = 'shell -- chmod +x "$@"'
desc = "Dar permiso de ejecución (+x)"

[[mgr.prepend_keymap]]
on = ["e", "r"]
run = 'shell -- chmod -x "$@"'
desc = "Quitar permiso de ejecución (-x)"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "Chmod on selected files"


# ==============================================================================
# 6. BÚSQUEDA Y FILTROS (Fzf, Ripgrep, Zoxide)
# ==============================================================================

# --- Búsquedas básicas ---
[[mgr.prepend_keymap]]
on = "f"
run = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "F"
run = "filter --smart"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = "I"
run = "plugin fzf"
desc = "Buscar archivos con fzf"

[[mgr.prepend_keymap]]
on = ["R"]
run = "search --via=rg"
desc = "Search files by content via ripgrep"

# --- Zoxide ---
[[mgr.prepend_keymap]]
on = "i"
run = "plugin zoxide"
desc = "Buscar carpetas con Zoxide"

[[mgr.prepend_keymap]]
on = ["z", "a"]
run = "shell 'zoxide add \"$(pwd)\"'"
desc = "Añadir ruta actual a Zoxide (pwd)"

[[mgr.prepend_keymap]]
on = ["z", "A"]
run = '''shell 'zoxide add "$0"''''
desc = "Añadir la carpeta bajo el cursor de Zoxide"

[[mgr.prepend_keymap]]
on = ["z", "r"]
run = "shell 'zoxide remove \"$(pwd)\"'"
desc = "Eliminar ruta actual de Zoxide (pwd)"

[[mgr.prepend_keymap]]
on = ["z", "R"]
run = '''shell 'zoxide remove "$0"''''
desc = "Eliminar la carpeta bajo el cursor de Zoxide"


# ==============================================================================
# 7. ACCIONES CON PRIVILEGIOS (Plugin Sudo)
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["S", "a"]
run = "plugin sudo -- create"
desc = "sudo create"

[[mgr.prepend_keymap]]
on = ["S", "p"]
run = "plugin sudo -- paste"
desc = "sudo paste"

[[mgr.prepend_keymap]]
on = ["S", "P"]
run = "plugin sudo -- paste --force"
desc = "sudo paste force"

[[mgr.prepend_keymap]]
on = ["S", "r"]
run = "plugin sudo -- rename"
desc = "sudo rename"

[[mgr.prepend_keymap]]
on = ["S", "l", "l"]
run = "plugin sudo -- link"
desc = "sudo link"

[[mgr.prepend_keymap]]
on = ["S", "p", "r"]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"

[[mgr.prepend_keymap]]
on = ["S", "l", "L"]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"

[[mgr.prepend_keymap]]
on = ["S", "m"]
run = "plugin sudo -- chmod"
desc = "sudo chmod"

[[mgr.prepend_keymap]]
on = ["S", "d"]
run = "plugin sudo -- remove"
desc = "sudo trash"

[[mgr.prepend_keymap]]
on = ["S", "D"]
run = "plugin sudo -- remove --permanently"
desc = "sudo delete"


# ==============================================================================
# 8. GESTIÓN DE PROYECTOS (Plugin Projects)
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["P", "s"]
run = "plugin projects save"
desc = "Save current project"

[[mgr.prepend_keymap]]
on = ["P", "L"]
run = "plugin projects load"
desc = "Load project"

[[mgr.prepend_keymap]]
on = ["P", "l"]
run = "plugin projects load_last"
desc = "Load last project"

[[mgr.prepend_keymap]]
on = ["P", "d"]
run = "plugin projects delete"
desc = "Delete project"

[[mgr.prepend_keymap]]
on = ["P", "D"]
run = "plugin projects delete_all"
desc = "Delete all projects"

[[mgr.prepend_keymap]]
on = ["P", "m"]
run = "plugin projects 'merge current'"
desc = "Merge current tab to other projects"

[[mgr.prepend_keymap]]
on = ["P", "M"]
run = "plugin projects 'merge all'"
desc = "Merge current project to other projects"


# ==============================================================================
# 9. PAPELERA Y RESTAURACIÓN DE ARCHIVOS
# ==============================================================================

[[mgr.prepend_keymap]]
on = ["u", "u"]
run = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on = ["u", "b"]
run = "plugin recycle-bin"
desc = "Open recicle bin menu"


# ==============================================================================
# 10. MONTAJE DE UNIDADES Y OTROS
# ==============================================================================

[[mgr.prepend_keymap]]
on = "<C-m>"
run = "plugin mount"
desc = "Mount/Unmount partitions menu"
