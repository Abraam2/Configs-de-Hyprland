[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd ~/.mydotfiles/com.ml4w.dotfiles/.config"
desc = "Go ML4W Config"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Documentos"
desc = "Go ~/Documentos/"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/Descargas/"
desc = "Go ~/Descargas/"

[[mgr.prepend_keymap]]
on = ["g", "h"]
run = "cd ~"
desc = "Go ~"

[[mgr.prepend_keymap]]
on = ["g", "H"]
run = "cd ~/.mydotfiles/com.ml4w.dotfiles.stable/.config/hypr/"
desc = "Go Hypr Config"

[[mgr.prepend_keymap]]
on = ["g", "."]
run = ["cd /home/abraham/MisDotfiles", "hidden toggle" ]
desc = "Go MisDotfiles"

[[mgr.prepend_keymap]]
on = ["<C-z>", "u"]
run = "shell -- ouch decompress %s"
desc = "Descomprimir archivos seleccionados"

[[mgr.prepend_keymap]]
on = ["<C-z>", "z"]
run = "shell -- ouch compress %s %h.zip"
desc = "Comprimir selección en .zip"

[[mgr.prepend_keymap]]
on = ["<C-z>", "t"]
run = "shell -- ouch compress %s %h.tar.gz"
desc = "Comprimir selección en .tar.gz"

[[mgr.prepend_keymap]]
on = ["<C-z>", "7"]
run = "shell -- ouch compress %s %h.7z"
desc = "Comprimir selección en .7z"

[[mgr.prepend_keymap]]
on   = [ "Z", "x" ]
run  = '''
    shell 'ouch decompress "%s" && find . -maxdepth 1 -type d -printf "%T@ %p\n" | sort -n | tail -1 | cut -d" " -f2- | xargs -I {} sh -c "mv {}/* . && rm -rf {}"' --confirm
'''
desc = "Descomprimir y extraer contenido a la raíz"

[[mgr.prepend_keymap]]
on   = [ "<C-z>", "x" ]
run  = '''
    shell 'ouch decompress "%s" && find . -maxdepth 1 -type d -printf "%T@ %p\n" | sort -n | tail -1 | cut -d" " -f2- | xargs -I {} sh -c "mv {}/* . && rm -rf {}"' --confirm
'''
desc = "Descomprimir y extraer contenido a la raíz"

[[mgr.prepend_keymap]]
on   = [ "Z", "m" ] 
run = "plugin mover"
desc = "Mover archivos de extensión X desde subcarpetas aquí"

[[mgr.prepend_keymap]]
on   = [ "M" ] 
run = "plugin mover"
desc = "Mover archivos de extensión X desde subcarpetas aquí"

[[mgr.prepend_keymap]]
on   = [ "z", "a" ] 
run  = "shell 'zoxide add \"$(pwd)\"'" 
desc = "Añadir ruta actual a Zoxide (pwd)"

[[mgr.prepend_keymap]]
on   = [ "z", "A" ] 
run  = '''shell 'zoxide add "$0"''''
desc = "Añadir la carpeta bajo el cursor de Zoxide"

[[mgr.prepend_keymap]]
on   = [ "z", "R" ] 
run  = '''shell 'zoxide remove "$0"''''
desc = "Eliminar la carpeta bajo el cursor de Zoxide"

[[mgr.prepend_keymap]]
on   = [ "z", "r" ] 
run  = "shell 'zoxide remove \"$(pwd)\"'" 
desc = "Eliminar ruta actual de Zoxide (pwd)"

# run  = "shell 'kitty \"$(pwd)\"'"
# Borrar base datos zoxide = zoxide remove (zoxide query -l) 

[[mgr.prepend_keymap]]
on = ["e", "a"]
run = 'shell -- chmod +x "$@"'
desc = "Dar permiso de ejecución (+x)"

[[mgr.prepend_keymap]]
on = ["e", "r"]
run = 'shell -- chmod -x "$@"'
desc = "Quitar permiso de ejecución (-x)"

[[mgr.prepend_keymap]]
